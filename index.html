<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>よつば在庫</title>
<meta name="description" content="よつば建設工業 社内向け 在庫管理アプリ（鋼材・消耗品）">
<meta name="theme-color" content="#177a49">
<!-- iPhone「ホーム画面に追加」用: アイコン・表示名・全画面起動 -->
<meta name="apple-mobile-web-app-title" content="よつば在庫">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-v2-48.png" sizes="48x48" type="image/png">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-v2-180.png">
<style>
  /* 起動直後の背景色だけインラインで持つ。外部CSSの読み込みを待たずに
     1フレーム目から玄関と同じ白で塗り、PWA起動時のちらつきを防ぐため。
     （スプラッシュは廃止。起動したらそのまま玄関画面を出す） */
  html, body { margin: 0; background: #fff; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 消耗品セクション: Noto Sans JP ／ 玄関・鋼材セクション: M PLUS Rounded 1c（1リクエストにまとめる） -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="./app.css?v=24">
<link rel="stylesheet" href="./steel.css?v=24">
</head>
<body>
<script>
  // iOS Safari はビューポート設定(user-scalable=no)を無視することがあるため、
  // ジェスチャーイベントを止めてページ全体のピンチズームを抑止する。
  // （写真ビューアの拡大は独自実装のため影響なし）
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('gesturechange', function (e) { e.preventDefault(); });
</script>
<div id="app">
  <div style="padding:48px 24px;text-align:center;font-size:14px;opacity:.7">読み込み中…</div>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<script type="module" src="./js/app.js?v=24"></script>
<script>
  // PWA: Service Worker 登録（ローカルファイル直開きでは無効）
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
